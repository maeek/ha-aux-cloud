name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        home-assistant: [minimum, latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Install minimum Home Assistant and test dependencies
        if: matrix.home-assistant == 'minimum'
        run: pip install -r requirements.test.txt "homeassistant==2026.4.*"
      - name: Install latest Home Assistant and test dependencies
        if: matrix.home-assistant == 'latest'
        run: pip install pytest-homeassistant pytest-cov pycryptodome==3.23.0
      - name: Run tests
        run: pytest -q

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.test.txt
      - run: pip install --upgrade "homeassistant==2026.4.*"
      - run: ruff format --check custom_components/aux_cloud tests
      - run: ruff check custom_components/aux_cloud tests
      - run: mypy custom_components/aux_cloud
