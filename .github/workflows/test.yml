name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        home-assistant: [minimum, latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Install test dependencies
        run: pip install -r requirements.test.txt
      - name: Install minimum Home Assistant
        if: matrix.home-assistant == 'minimum'
        run: pip install --upgrade "homeassistant==2026.4.*"
      - name: Install latest Home Assistant
        if: matrix.home-assistant == 'latest'
        run: >-
          pip install --upgrade
          homeassistant
          pytest-homeassistant-custom-component
      - name: Run tests
        run: pytest -q
      - name: Require complete config-flow coverage
        run: >-
          coverage report
          --include=custom_components/aux_cloud/config_flow.py
          --fail-under=100

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.test.txt
      - run: pip install --upgrade "homeassistant==2026.4.*"
      - run: ruff format --check custom_components/aux_cloud tests
      - run: ruff check custom_components/aux_cloud tests
      - run: mypy custom_components/aux_cloud
      - run: pylint custom_components/aux_cloud --fail-under=9.7
