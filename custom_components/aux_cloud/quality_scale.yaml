# This is a HACS custom integration, so Home Assistant does not assign it an
# official quality tier. This file tracks technical alignment with the current
# cumulative Integration Quality Scale.
rules:
  action-setup:
    status: exempt
    comment: The integration does not register custom service actions.
  appropriate-polling: done
  brands:
    status: exempt
    comment: Brand assets for custom integrations are managed outside Core.
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: The integration does not register custom service actions.
  docs-triggers:
    status: exempt
    comment: The integration does not provide custom triggers.
  docs-conditions:
    status: exempt
    comment: The integration does not provide custom conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage:
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: This cloud integration has no local network discovery information.
  discovery:
    status: exempt
    comment: AUX Cloud does not expose an account discovery mechanism before login.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices: done
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: exempt
    comment: Authentication uses reauth and transient cloud failures need no user repair.
  stale-devices: done
  async-dependency: done
  inject-websession: done
  strict-typing:
